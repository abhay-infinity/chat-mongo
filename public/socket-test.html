<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Connection Test - Nearby Chat</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }

        .status.disconnected {
            background: #fee;
            color: #c33;
            border: 2px solid #fcc;
        }

        .status.connecting {
            background: #ffeaa7;
            color: #d63031;
            border: 2px solid #fdcb6e;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .logs {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .log-entry {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }

        .log-entry.info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .log-entry.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .log-entry.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .log-entry.warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .info-box p {
            margin: 5px 0;
            font-size: 13px;
            color: #0d47a1;
        }

        .info-box strong {
            color: #1565c0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Socket.IO Test</h1>
        <p class="subtitle">Nearby Chat - Vercel Deployment Test</p>

        <div class="status disconnected" id="status">
            ⚪ Disconnected
        </div>

        <div class="info-box">
            <p><strong>Current URL:</strong> <span id="currentUrl"></span></p>
            <p><strong>Transport:</strong> <span id="transport">Not connected</span></p>
            <p><strong>Socket ID:</strong> <span id="socketId">Not connected</span></p>
        </div>

        <div class="input-group">
            <label for="serverUrl">Server URL</label>
            <input type="text" id="serverUrl" placeholder="https://near-by-chat-three.vercel.app"
                value="https://near-by-chat-three.vercel.app">
        </div>

        <div class="input-group">
            <label for="authToken">Auth Token (Optional)</label>
            <input type="text" id="authToken" placeholder="Enter your JWT token">
        </div>

        <button id="connectBtn" onclick="connectSocket()">Connect</button>
        <button id="disconnectBtn" onclick="disconnectSocket()"
            style="display:none; margin-top: 10px; background: #dc3545;">Disconnect</button>

        <div class="logs">
            <div class="log-title">📋 Connection Logs</div>
            <div id="logs"></div>
        </div>
    </div>

    <script>
        let socket = null;

        // Set current URL
        document.getElementById('currentUrl').textContent = window.location.href;

        function addLog(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            logEntry.textContent = `[${timestamp}] ${message}`;
            logsDiv.insertBefore(logEntry, logsDiv.firstChild);
        }

        function updateStatus(text, className) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = text;
            statusDiv.className = `status ${className}`;
        }

        function connectSocket() {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const authToken = document.getElementById('authToken').value.trim();

            if (!serverUrl) {
                addLog('❌ Please enter a server URL', 'error');
                return;
            }

            addLog(`🔄 Attempting to connect to: ${serverUrl}`, 'info');
            updateStatus('🟡 Connecting...', 'connecting');

            const options = {
                transports: ['polling', 'websocket'],
                path: '/socket.io/',
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: 5
            };

            if (authToken) {
                options.auth = { token: authToken };
                addLog(`🔑 Using auth token: ${authToken.substring(0, 20)}...`, 'info');
            }

            socket = io(serverUrl, options);

            // Connection successful
            socket.on('connect', () => {
                addLog('✅ Connected successfully!', 'success');
                updateStatus('🟢 Connected', 'connected');
                document.getElementById('socketId').textContent = socket.id;
                document.getElementById('transport').textContent = socket.io.engine.transport.name;
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'block';

                addLog(`Socket ID: ${socket.id}`, 'success');
                addLog(`Transport: ${socket.io.engine.transport.name}`, 'info');
            });

            // Connection error
            socket.on('connect_error', (error) => {
                addLog(`❌ Connection Error: ${error.message}`, 'error');
                updateStatus('🔴 Connection Failed', 'disconnected');
                console.error('Connection error:', error);
            });

            // Disconnection
            socket.on('disconnect', (reason) => {
                addLog(`⚠️ Disconnected: ${reason}`, 'warning');
                updateStatus('⚪ Disconnected', 'disconnected');
                document.getElementById('socketId').textContent = 'Not connected';
                document.getElementById('transport').textContent = 'Not connected';
                document.getElementById('connectBtn').style.display = 'block';
                document.getElementById('disconnectBtn').style.display = 'none';
            });

            // Reconnection attempt
            socket.io.on('reconnect_attempt', (attempt) => {
                addLog(`🔄 Reconnection attempt ${attempt}`, 'warning');
                updateStatus('🟡 Reconnecting...', 'connecting');
            });

            // Reconnection successful
            socket.io.on('reconnect', (attempt) => {
                addLog(`✅ Reconnected after ${attempt} attempts`, 'success');
                updateStatus('🟢 Connected', 'connected');
            });

            // Reconnection failed
            socket.io.on('reconnect_failed', () => {
                addLog('❌ Reconnection failed', 'error');
                updateStatus('🔴 Connection Failed', 'disconnected');
            });

            // Transport upgrade
            socket.io.engine.on('upgrade', (transport) => {
                addLog(`⬆️ Transport upgraded to: ${transport.name}`, 'success');
                document.getElementById('transport').textContent = transport.name;
            });

            // General error
            socket.on('error', (error) => {
                addLog(`🚨 Socket Error: ${error}`, 'error');
                console.error('Socket error:', error);
            });
        }

        function disconnectSocket() {
            if (socket) {
                socket.disconnect();
                addLog('👋 Manually disconnected', 'info');
            }
        }

        // Auto-connect if token is in URL
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        if (tokenFromUrl) {
            document.getElementById('authToken').value = tokenFromUrl;
            addLog('🔑 Token loaded from URL', 'info');
        }
    </script>
</body>

</html>
